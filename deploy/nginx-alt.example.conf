# Example only: adapt server_name and access ranges before installing.
server {
    listen 8788;
    listen [::]:8788;
    server_name console.example.com;

    access_log off;
    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;

    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    deny all;

    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8787/api/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    location = /ui/config.js {
        auth_request /_auth;
        error_page 401 = @need_login;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        alias /opt/mihomo-console/app/static/metacubexd-config.js;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/mihomo-console-core-auth.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location @need_login {
        return 302 /;
    }
}
